<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tres en linea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">
      <h2 class="text-center mt-4 mb-2 fw-bold text-info display-5">Juego 3 en línea</h2>

    <div class="container my-4">

        <form id="formulario">
            <div class="row justify-content-center g-3">
                <div class="col-12 col-md-4">
                    <div class="row align-items-center">
                        <div class="col-5 text-center">
                            <img src="img/X.png" class="img-fluid" width="60" alt="X">
                        </div>
                        <div class="col-7">
                            <input type="text" id="nombrejX" class="form-control" placeholder="Nombre del jugador 1" required>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="row align-items-center">
                        <div class="col-5 text-center">
                            <img src="img/circulo.png" class="img-fluid" width="60" alt="Círculo">
                        </div>
                        <div class="col-7">
                            <input type="text" id="nombrejO" class="form-control" placeholder="Nombre del jugador 2" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center my-4">
                <button type="submit" id="btnIniciar" class="btn btn-info text-white fw-bold rounded-pill px-4">Iniciar juego</button>
            </div>
        </form>

        <div class="col-12">
            <div class="row align-items-center justify-content-center">
                <div class="col-auto">
                    <h5 class="mb-0 fw-bold text-white">Turno:</h5>
                </div>
                <div class="col-4">
                    <input type="text" id="turno" class="form-control" readonly>
                </div>
            </div>
        </div>

        <!--matriz--->
        <div class="row justify-content-center mt-3">
            <div class="col-10 col-md-5 col-lg-4">
                <div id="tablero" class="row g-2 text-center">
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla1" onclick="jugar(0)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla2" onclick="jugar(1)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla3" onclick="jugar(2)"></div></div>

                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla4" onclick="jugar(3)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla5" onclick="jugar(4)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla6" onclick="jugar(5)"></div></div>

                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla7" onclick="jugar(6)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla8" onclick="jugar(7)"></div></div>
                    <div class="col-4"><div class="ratio ratio-1x1"><img src="img/fondo.jpg" class="object-fit-cover" alt="fondo" id="casilla9" onclick="jugar(8)"></div></div>
                </div>
            </div>
        </div>

        <!-- lista de resultados -->
        <div class="row justify-content-center mt-4">
            <div class="col-10 col-md-5 col-lg-4">
                <h5 class="fw-bold text-white">Resultados</h5>
                <ul id="resultados" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const lineas = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const nombrejX = document.getElementById("nombrejX");
        const nombrejO = document.getElementById("nombrejO");
        const turno = document.getElementById("turno");
        const casillas = document.querySelectorAll("#tablero img");

        let estado = new Array(9).fill(0);
        let actual = 1;
        let jugadas = 0;
        let jugando = false;

        function nombreActual() {
            if (actual === 1) {
                return nombrejX.value;
            } else {
                return nombrejO.value;
            }
        }

        document.getElementById("formulario").addEventListener("submit", function(e) {
            e.preventDefault();
            estado.fill(0);
            actual = 1;
            jugadas = 0;
            jugando = true;

            turno.value = nombreActual();
            turno.classList.remove("bg-warning-subtle");
            turno.classList.add("bg-info-subtle");

            document.getElementById("btnIniciar").textContent = "Iniciar juego";

            for (let i = 0; i < 9; i++) {
                casillas[i].src = "img/fondo.jpg";
            }
        });

        function jugar(i) {
            if (!jugando || estado[i] !== 0) {
                return;
            }
            switch (actual) {
                case 1:
                    estado[i] = 1;
                    casillas[i].src = "img/X.png";
                    break;
                case 2:
                    estado[i] = 2;
                    casillas[i].src = "img/circulo.png";
                    break;
            }
            jugadas++;

            let gano = false;
            for (let linea of lineas) {
                if (estado[linea[0]] === actual && estado[linea[1]] === actual && estado[linea[2]] === actual) {
                    gano = true;
                    break;
                }
            }

            if (gano || jugadas === 9) {
                jugando = false;
                turno.value = "";
                turno.classList.remove("bg-info-subtle", "bg-warning-subtle");
                let li = document.createElement("li");
                li.className = "list-group-item";

                if (gano) {
                    li.textContent = "Ganó " + nombreActual();
                } else {
                    li.textContent = "Empate";
                }

                li.onclick = function() {
                    li.remove();
                };
                document.getElementById("resultados").appendChild(li);
            } else {
                switch (actual) {
                    case 1:
                        actual = 2;
                        turno.classList.remove("bg-info-subtle");
                        turno.classList.add("bg-warning-subtle");
                        break;
                    case 2:
                        actual = 1;
                        turno.classList.remove("bg-warning-subtle");
                        turno.classList.add("bg-info-subtle");
                        break;
                }
                turno.value = nombreActual();
            }
        }
    </script>
</body>
</html>
